name: Keep Render backend awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -fsS -o /dev/null -w "backend health: %{http_code} (%{time_total}s)\n" \
            https://ielts-api-hypc.onrender.com/health || echo "backend not responding (will retry next run)"